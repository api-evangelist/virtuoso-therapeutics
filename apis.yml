aid: virtuoso-therapeutics
name: Virtuoso Therapeutics
description: >-
  Virtuoso Therapeutics is a biopharmaceutical company advancing a pipeline of novel
  bispecific antibodies to treat cancer. Using a differentiated approach to antibody
  engineering, the company designs molecules intended to overcome the limitations of
  existing therapies and to address major hurdles facing emerging classes of oncology
  treatments. Virtuoso is a venture-backed portfolio company of Canaan Partners. This
  profile is maintained in the API Evangelist network; the company currently publishes
  no public API or developer surface.
